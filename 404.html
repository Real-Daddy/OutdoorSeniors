/* ==========================================================================
   OutdoorSeniors, shared stylesheet
   Mobile-first: base styles target small screens, min-width queries scale up.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #1a1a1a;
  background: #fff;
  line-height: 1.6;
  font-size: 16px;
}

a { text-decoration: none; color: inherit; }
img { max-width: 100%; display: block; }

:root {
  --green-dark: #111111;
  --green-mid: #333333;
  --green-light: #555555;
  --amber: #111111;
  --amber-bg: #F0F0F0;
  --wa-green: #25D366;
  --wa-dark: #128C7E;
  --cream: #F7F7F7;
  --border: #E0E0E0;
  --text-light: #666;
  --text-xs: #999;
  --ok: #16794C;
  --ok-bg: #E8F4EE;
  --no: #C2413B;
  --no-bg: #FBEDEC;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow-hover: 0 8px 24px rgba(0,0,0,0.08);
}

:focus-visible {
  outline: 3px solid var(--wa-dark);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ---------- Layout primitives ---------- */

.container { max-width: 1100px; margin: 0 auto; padding: 0 18px; }

section { padding: 48px 0; scroll-margin-top: 64px; }

.section-label {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--amber);
  margin-bottom: 10px;
}
.section-title {
  font-size: 28px;
  font-weight: 800;
  line-height: 1.2;
  color: #111;
  margin-bottom: 14px;
  letter-spacing: -0.5px;
}
.section-sub {
  font-size: 15px;
  color: var(--text-light);
  max-width: 580px;
  margin-bottom: 32px;
  line-height: 1.7;
}

/* ---------- Nav ---------- */

nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #fff;
  border-bottom: 1px solid var(--border);
  padding: 14px 0;
}
.nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.logo { font-size: 17px; font-weight: 800; color: var(--green-dark); letter-spacing: -0.5px; flex-shrink: 0; }
.logo span { color: var(--amber); }
.logo { display: flex; align-items: center; }
.logo img { display: block; height: 36px; width: auto; }
.nav-links { display: none; align-items: center; gap: 28px; }
.nav-link { font-size: 13px; font-weight: 500; color: #555; letter-spacing: 0.2px; transition: color 0.15s; white-space: nowrap; }
.nav-link:hover { color: #000; }
.nav-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

.hamburger {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  padding: 7px 8px;
  width: 38px;
  height: 38px;
}
.hamburger span {
  display: block;
  height: 2px;
  width: 18px;
  background: #111;
  border-radius: 2px;
  transition: transform 0.2s, opacity 0.2s;
}
.hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

.mobile-menu { display: none; border-top: 1px solid var(--border); background: #fff; }
.mobile-menu.open { display: block; }
.mobile-link {
  display: block;
  padding: 14px 0;
  font-size: 15px;

  color: #333;
  border-bottom: 1px solid #F0F0F0;
  transition: color 0.15s, padding-left 0.15s;
}
.mobile-link:last-child { border-bottom: none; }
.mobile-link:hover { color: #000; padding-left: 4px; }

.nav-cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--wa-green);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  padding: 9px 16px;
  border-radius: 50px;
  transition: background 0.2s, transform 0.2s;
  white-space: nowrap;
}
.nav-cta:hover { background: var(--wa-dark); transform: translateY(-1px); }

/* ---------- City switcher + language toggle ---------- */

.nav-tools { display: flex; align-items: center; gap: 8px; }
.city-wrap { position: relative; }

.city-chip {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 7px 12px;
  font-size: 13px;
  font-weight: 600;
  color: #222;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  transition: border-color 0.15s;
}
.city-chip:hover { border-color: #111; }
.city-chip .pin { font-size: 13px; line-height: 1; }
.chip-icon {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
  color: #444;
}
.cm-icon {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
  color: #777;
}
.city-chip .caret { color: var(--text-xs); font-size: 10px; }

.city-menu {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  min-width: 180px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: 0 10px 30px rgba(0,0,0,0.14);
  padding: 6px;
  display: none;
  z-index: 200;
}
.city-menu.open { display: block; }
.city-menu a {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 12px;
  font-size: 14px;
  font-weight: 500;
  color: #333;
  border-radius: 6px;
  text-align: left;
}
.city-menu a:hover { background: var(--cream); color: #000; }
.city-menu a.current { font-weight: 700; color: #111; background: var(--cream); }
.city-menu a.current .cm-icon, .city-menu a:hover .cm-icon { color: #222; }
.city-menu .cm-label {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-xs);
  padding: 6px 12px 4px;
  font-weight: 700;
}

.lang-toggle {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--border);
  border-radius: 50px;
  overflow: hidden;
  background: #fff;
}
.lang-toggle a {
  padding: 7px 11px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text-light);
  transition: background 0.15s, color 0.15s;
}
.lang-toggle a.active { background: #111; color: #fff; }
.lang-toggle a:not(.active):hover { background: var(--cream); color: #111; }

/* City badge used inside page copy */
.city-inline { font-weight: 700; color: #111; }

@media (max-width: 899px) {
  .nav-cta { display: none; }      /* sticky WhatsApp button covers this on phones */
  .city-chip { padding: 6px 9px; font-size: 12.5px; }
  .lang-toggle a { padding: 6px 9px; font-size: 12px; }
  /* the bar has to fit the longest city name, so keep the gaps tight */
  .nav-inner { gap: 8px; }
  .nav-right { gap: 7px; }

  /* Logo + chip + language toggle + hamburger overflow a 375px screen by
     ~29px. The city chip earns its place in the bar; language switching is
     rarer, so it moves into the mobile menu instead. */
  .nav-tools > .lang-toggle { display: none; }
  .logo { font-size: 16px; }
  .logo img { height: 30px; }
}

/* Cloned copy of the toggle, shown only inside the mobile menu */
.mobile-lang {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 0 4px;
  border-top: 1px solid #F0F0F0;
  margin-top: 4px;
}
.mobile-lang .ml-label {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-xs);
}

/* ---------- Buttons ---------- */

.btn-wa {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: var(--wa-green);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  padding: 16px 28px;
  border-radius: 50px;
  transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 20px rgba(37,211,102,0.35);
  width: 100%;
  text-align: center;
}
.btn-wa:hover {
  background: var(--wa-dark);
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(37,211,102,0.45);
}

.btn-book {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  background: var(--wa-green);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  padding: 15px;
  border-radius: var(--radius-sm);
  transition: background 0.2s, transform 0.2s;
  border: none;
  cursor: pointer;
  font-family: inherit;
}
.btn-book:hover { background: var(--wa-dark); transform: translateY(-1px); }

.btn-outline {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 2px solid #111;
  color: #111;
  background: #fff;
  font-size: 14px;
  font-weight: 700;
  padding: 12px 22px;
  border-radius: 50px;
  transition: background 0.2s, color 0.2s;
}
.btn-outline:hover { background: #111; color: #fff; }

.wa-svg { width: 22px; height: 22px; fill: #fff; flex-shrink: 0; }
.wa-svg-sm { width: 17px; height: 17px; }

/* ---------- Hero ---------- */

.hero {
  background: var(--cream);
  padding: 44px 0 36px;
  border-bottom: 1px solid var(--border);
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #EDEDED;
  color: var(--green-mid);
  font-size: 12px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 50px;
  margin-bottom: 20px;
}
/* City strip: where we operate, shown in the hero above the headline.
   The red dot says "live now" the way a broadcast does. Blinking words were
   the other option and they read as a 90s marquee, so the dot pulses instead
   and anyone who asks the browser for less motion gets it still. */
.city-strip {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px 6px;
  margin-bottom: 18px;
}
.cs-label {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #D6303A;
  margin-right: 4px;
}
.cs-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #D6303A;
  flex-shrink: 0;
  animation: cs-pulse 2.4s ease-in-out infinite;
}
@keyframes cs-pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(214, 48, 58, 0.45); }
  50%      { opacity: 0.55; box-shadow: 0 0 0 5px rgba(214, 48, 58, 0); }
}
.cs-sep { color: var(--border); font-size: 13px; }
.cs-city {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: #555;
  padding: 5px 11px;
  border: 1px solid transparent;
  border-radius: 50px;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.cs-city:hover,
.cs-city:focus-visible {
  background: #E9E9E9;
  border-color: #DADADA;
  color: #111;
}
/* the city you are on: outlined rather than filled, so hover still reads */
.cs-current {
  color: #111;
  font-weight: 700;
  background: #fff;
  border-color: #D9D9D9;
}
.cs-current:hover { background: #E9E9E9; }
.cs-icon {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

/* phones: the label costs more room than it earns, so the three cities fit on one line */
@media (max-width: 599px) {
  .city-strip { gap: 4px 2px; flex-wrap: nowrap; }
  /* keep the live dot, drop the words: the cue survives, the room is freed */
  .cs-label { font-size: 0; gap: 0; margin-right: 2px; }
  .cs-city { font-size: 12.5px; gap: 5px; padding: 4px 8px; }
  .cs-icon { width: 18px; height: 18px; }
}
@media (max-width: 359px) {
  .cs-city { font-size: 12px; gap: 0; padding: 4px 6px; }
  .cs-icon { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .cs-dot { animation: none; }
}

.hero h1 {
  font-size: 32px;
  font-weight: 800;
  line-height: 1.12;
  color: #111;
  margin-bottom: 18px;
  letter-spacing: -0.8px;
  max-width: 700px;
}
.hero h1 em { font-style: normal; color: var(--green-mid); }
.hero-sub {
  font-size: 16px;
  color: #444;
  margin-bottom: 28px;
  max-width: 560px;
  line-height: 1.7;
}
.hero-note { font-size: 13px; color: #444; margin-top: 16px; }

/* ---------------------------------------------------------------------------
   Hero with full-bleed photograph.
   The photo sits behind everything; a cream scrim runs left-to-right so the
   headline always has an opaque ground under it and the image is only fully
   visible on the right, where the subjects are.
   --------------------------------------------------------------------------- */

.hero {
  position: relative;
  background-color: var(--cream);
  overflow: hidden;
  isolation: isolate;
}

.hero-photo {
  position: absolute;
  inset: 0;
  z-index: -2;
}
.hero-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  /* keep the two men in frame when the box gets narrower than 21:9 */
  object-position: 72% center;
}

/* The scrim. Mobile keeps it almost solid so type stays readable over a
   heavily cropped image; wider screens let more of the photo through. */
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(
    to bottom,
    rgba(247,247,247,0.985) 0%,
    rgba(247,247,247,0.97) 58%,
    rgba(247,247,247,0.92) 80%,
    rgba(247,247,247,0.80) 100%
  );
}

.hero-inner { position: relative; }
.hero-copy { max-width: 620px; }

/* ---------- Trust bar ---------- */

.trust-bar { background: var(--green-dark); padding: 18px 0; }
.trust-items { display: flex; flex-wrap: wrap; gap: 10px 20px; justify-content: center; align-items: center; }
.trust-item { display: flex; align-items: center; gap: 8px; color: #fff; font-size: 13px; font-weight: 500; }

/* ---------- Service categories + tiles (homepage) ---------- */

.services { background: var(--cream); }

.cat-block { margin-bottom: 32px; }
.cat-block:last-of-type { margin-bottom: 0; }

.cat-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 9px;
  border-bottom: 1px solid #D8D8D8;
}
.cat-title {
  font-size: 16px;
  font-weight: 800;
  color: #111;
  letter-spacing: -0.2px;
}
.cat-count {
  font-size: 11px;
  color: var(--text-xs);
  font-weight: 500;
  margin-left: auto;
  white-space: nowrap;
}

.tile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.tile {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
}
.tile:hover {
  border-color: #111;
  box-shadow: var(--shadow-hover);
  transform: translateY(-3px);
}

/* Square art panel, swap the emoji span for an <img> when photos are ready */
.tile-art {
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  line-height: 1;
  background: var(--tint, #F0F0F0);
  position: relative;
}
.tile-art img { width: 100%; height: 100%; object-fit: cover; }

.tile-plus {
  position: absolute;
  right: 8px;
  bottom: 8px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 7px rgba(0,0,0,0.16);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--wa-dark);
  font-size: 17px;
  font-weight: 700;
  line-height: 1;
  transition: background 0.2s, color 0.2s;
}
.tile:hover .tile-plus { background: var(--wa-dark); color: #fff; }

.tile-body { padding: 11px 12px 13px; }
.tile-name {
  font-size: 13.5px;
  font-weight: 700;
  color: #111;
  line-height: 1.3;
  margin-bottom: 4px;
}
.tile-meta { font-size: 11px; color: var(--text-xs); line-height: 1.45; }

/* Per-category tints on the art panel */
.cat-elder   .tile-art { --tint: #F1EDE5; }
.cat-nursing .tile-art { --tint: #E8EEF3; }
.cat-baby    .tile-art { --tint: #F3EBED; }

/* Catch-all strip under the grid */
.catchall-strip {
  margin-top: 28px;
  border: 2px dashed #C8C8C8;
  border-radius: var(--radius);
  background: #FCFCFC;
  padding: 22px 20px;
  text-align: center;
}
.catchall-strip h3 {
  font-size: 18px;
  font-weight: 800;
  color: #111;
  margin-bottom: 8px;
  letter-spacing: -0.3px;
}
.catchall-strip p {
  font-size: 14px;
  color: var(--text-light);
  line-height: 1.6;
  margin-bottom: 18px;
  max-width: 460px;
  margin-left: auto;
  margin-right: auto;
}

/* ---------- Areas served (city pages) ---------- */
.areas { background: #fff; padding-bottom: 8px; }
.areas .section-sub { max-width: 760px; }

/* ---------- How it works / steps ---------- */

.how { background: #fff; }
.steps { display: grid; grid-template-columns: 1fr; gap: 20px; }
.step { text-align: center; padding: 16px; }
.step-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 52px;
  height: 52px;
  background: var(--green-dark);
  color: #fff;
  font-size: 21px;
  font-weight: 800;
  border-radius: 50%;
  margin: 0 auto 16px;
}
.step-title { font-size: 17px; font-weight: 700; color: #111; margin-bottom: 8px; }
.step-desc { font-size: 14px; color: var(--text-light); line-height: 1.6; }

/* ---------- Why us ---------- */

.why { background: var(--cream); }
.why-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
.why-card {
  background: #fff;
  border-radius: var(--radius);
  padding: 20px;
  border: 1px solid var(--border);
  display: flex;
  gap: 14px;
  align-items: flex-start;
}
.why-icon { font-size: 24px; flex-shrink: 0; line-height: 1.2; }
.why-title { font-size: 15px; font-weight: 700; color: #111; margin-bottom: 4px; }
.why-desc { font-size: 13px; color: var(--text-light); line-height: 1.5; }

/* ==========================================================================
   SERVICE DETAIL PAGES
   ========================================================================== */

/* Breadcrumb */
.crumb { padding: 14px 0 0; font-size: 13px; color: var(--text-xs); }
.crumb a { color: var(--text-light); }
.crumb a:hover { color: #111; text-decoration: underline; }
.crumb .sep { margin: 0 6px; }

/* Service hero */
.svc-hero { background: var(--cream); padding: 24px 0 32px; border-bottom: 1px solid var(--border); }
.svc-eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-light);
  margin-bottom: 10px;
}
.svc-hero h1 {
  font-size: 30px;
  font-weight: 800;
  line-height: 1.15;
  letter-spacing: -0.7px;
  color: #111;
  margin-bottom: 14px;
}
.svc-headline {
  font-size: 18px;
  font-weight: 600;
  color: var(--green-mid);
  line-height: 1.45;
  margin-bottom: 14px;
  max-width: 560px;
}
.svc-intro { font-size: 15.5px; color: #444; line-height: 1.7; max-width: 620px; margin-bottom: 24px; }

/* Service hero photo */
.svc-photo {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  aspect-ratio: 16 / 10;
  overflow: hidden;
  background: #EDEDED;
  margin-bottom: 22px;
}
.svc-photo img { width: 100%; height: 100%; object-fit: cover; }

/* Includes / excludes */
.inex { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
.inex-col h3 {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 14px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--border);
}
.inex-col.yes h3 { color: var(--ok); }
.inex-col.no h3 { color: var(--no); }
.inex-col ul { list-style: none; }
.inex-col { min-width: 0; }
.inex-col li {
  display: flex;
  min-width: 0;
  overflow-wrap: break-word;
  gap: 11px;

  color: #333;

/* How it's done */
.howto { list-style: none; counter-reset: hstep; }
.howto li {

  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 14px;

  border-top: 1px solid var(--border);
  align-items: start;
}
.howto li:first-child { border-top: none; padding-top: 0; }
.howto li::before {
  content: counter(hstep);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  background: #111;
  color: #fff;
  border-radius: 50%;
  font-size: 13px;
  font-weight: 800;

/* Enquiry / duration selector card */

  padding: 22px 18px;

}
.enquire h3 { font-size: 19px; font-weight: 800; color: #111; margin-bottom: 6px; letter-spacing: -0.3px; }

.dur-select-label {

}
.duration-selector { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.dur-opt {

  border-radius: 50px;
  padding: 9px 16px;

  transition: border-color 0.15s, background 0.15s, color 0.15s;
  user-select: none;
  font-size: 13.5px;
  font-weight: 600;
  color: #444;
  background: #fff;
  font-family: inherit;
}
.dur-opt:hover { border-color: var(--green-mid); background: #F5F5F5; }
.dur-opt.dur-active { border-color: #111; background: #111; color: #fff; }

.enquire-note { font-size: 12.5px; color: var(--text-xs); margin-top: 12px; text-align: center; line-height: 1.5; }

/* FAQ */
.faq-list { border-top: 1px solid var(--border); }
.faq-item { border-bottom: 1px solid var(--border); }
.faq-item summary {
